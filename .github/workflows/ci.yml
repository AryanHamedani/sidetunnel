name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sidetunnel:dev .
      - run: RUN_DOCKER_TESTS=1 python3 -m unittest discover -s tests -p test_container.py -v
      - name: Make sure the TUN device exists
        run: sudo modprobe tun || true; test -c /dev/net/tun || { sudo mkdir -p /dev/net && sudo mknod /dev/net/tun c 10 200; }
      - run: tests/e2e.sh
